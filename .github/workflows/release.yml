name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: JamProject-Octopus-windows-x64.exe
            pyinstaller_out: dist/JamProject-Octopus.exe
            extra_flags: --noconsole
          - os: ubuntu-22.04
            artifact_name: JamProject-Octopus-linux-x64
            pyinstaller_out: dist/JamProject-Octopus
            extra_flags: ""
          - os: macos-latest
            artifact_name: JamProject-Octopus-macos
            pyinstaller_out: dist/JamProject-Octopus
            extra_flags: --windowed
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install (linux deps for Qt)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxkbcommon0

      - name: pip install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: build with PyInstaller
        shell: bash
        run: |
          pyinstaller --onefile ${{ matrix.extra_flags }} --name JamProject-Octopus octopus.py
          ls -la dist/

      - name: rename for release
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.pyinstaller_out }}" "out/${{ matrix.artifact_name }}"
          # generate sha256 sidecar
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 "out/${{ matrix.artifact_name }}" > "out/${{ matrix.artifact_name }}.sha256"
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            sha256sum "out/${{ matrix.artifact_name }}" > "out/${{ matrix.artifact_name }}.sha256"
          else
            powershell -Command "(Get-FileHash 'out/${{ matrix.artifact_name }}').Hash.ToLower() + '  ${{ matrix.artifact_name }}'" > "out/${{ matrix.artifact_name }}.sha256"
          fi
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: out/*

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: flatten
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          ls -la out/

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/*
